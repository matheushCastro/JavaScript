<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n1=Number(prompt("Digite primeiro numero"));
        let n2= Number(prompt("Digite  um segundo numero"));
        let soma=n1+n2

        alert("Soma:"+ soma);

        let sub= n1-n2;
        alert("Subtracao:"+ sub);

        let mult=n1 * n2;
        alert("Mutiplicacao:"+ mult);

        let div= n1/n2;
        alert("Divisao:"+ div);
        
        let resto=n1% n2;
        alert(" Resto:"+ resto)


        
    </script>
    
</body>
</html>
