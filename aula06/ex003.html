<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa...</title>
    <style>
        body {

            background-color: rgb(130, 130, 140);
            color:rgb(255, 255, 255);
            font:normal 20px Arial;
        }
        h1 {
            color:rgb(215, 198, 212);
        }
   
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Bem-vindo ao meu primeiro programa em HTML!</p>
    <script>
       var n1=Number(window.prompt("Digite um número: "));
       var n2=Number(window.prompt("Digite outro número: "));
       var soma= n1 + n2;
       window.alert(`a soma entre ${n1} e ${n2} é igual a ${soma}`);    
       
       /*neste codigo aprendi quando se converte o tipo primitivo
       usei Number.parseFloat()  e tambem Number.parseInt()
       onde de comeco na soma estava digamos que juntando os numeros digitados
       nao os somando ex(1+2= 12 ) sem ser (1+2= 3)*/
</script>
</body>
</html>
